name: PCR Fractal X035 support-thickness clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x035-std-ali-base-20260804
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x035-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/FiniteBadStratumCoverage.lean
            PCRLean/Experimental/SupportThicknessAlternative.lean
            PCRLean/Experimental/StratumInductionActiveLift.lean
            PCRLean/Experimental/SupportThicknessRank.lean
            PCRLean/Experimental/NilpotentThickness.lean
            PCRLean/Experimental/X035SupportThicknessIndex.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            echo 'Forbidden placeholder or project axiom detected.'
            exit 1
          fi

      - name: Install pinned Lean toolchain through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned Lake manifest when absent
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if [[ ! -f lake-manifest.json ]]; then
            lake update
          fi
          test -f lake-manifest.json

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x035-evidence
          git rev-parse HEAD | tee x035-evidence/COMMIT.txt
          cat lean-toolchain | tee x035-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain \
            | tee x035-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x035-evidence/LEAN_VERSION.txt
          lake --version | tee x035-evidence/LAKE_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x035-evidence/LAKE_BUILD.log

      - name: Elaborate integrated X035 source
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X035SupportThicknessIndex.lean \
            2>&1 | tee x035-evidence/X035_ELABORATION.log

      - name: Run unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X035SupportThicknessIndexAudit.lean \
            2>&1 | tee x035-evidence/X035_AXIOM_AUDIT.log
          if grep -q 'sorryAx' x035-evidence/X035_AXIOM_AUDIT.log; then
            echo 'sorryAx detected in axiom output.'
            exit 1
          fi

      - name: Snapshot exact sources
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/FiniteBadStratumCoverage.lean x035-evidence/
          cp PCRLean/Experimental/SupportThicknessAlternative.lean x035-evidence/
          cp PCRLean/Experimental/StratumInductionActiveLift.lean x035-evidence/
          cp PCRLean/Experimental/SupportThicknessRank.lean x035-evidence/
          cp PCRLean/Experimental/NilpotentThickness.lean x035-evidence/
          cp PCRLean/Experimental/X035SupportThicknessIndex.lean x035-evidence/
          cp PCRLean/Experimental/X035SupportThicknessIndexAudit.lean x035-evidence/
          cp PCRLean/ResearchRecords/MLEL_X035_STD_ALI_REPORT.md x035-evidence/
          cp PCRLean/ResearchRecords/MLEL_X035_ANNALS_SERIES_MLE.md x035-evidence/
          sha256sum x035-evidence/* | tee x035-evidence/X035_SOURCE_SHA256SUMS.txt

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X035-STD-ALI-EVIDENCE
          path: x035-evidence
          if-no-files-found: error
          retention-days: 90
