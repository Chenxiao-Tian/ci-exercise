name: PCR Jump local graph macro clean room

on:
  pull_request:
    branches:
      - pcr-jump-local-macro-ci-base-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-local-macro-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-macro-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders in the exact local-macro slice
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/GradedFrobeniusHeredityKernelIndex.lean \
              PCRLean/Experimental/GradedFrobeniusHeredityKernelIndexAudit.lean \
              PCRLean/Experimental/PolynomialGraphPassiveSafety.lean \
              PCRLean/Experimental/PolynomialGraphBoundaryIntersection.lean \
              PCRLean/Experimental/PolynomialGraphBoundaryStrata.lean \
              PCRLean/Experimental/PolynomialGraphJointLegalityCertificate.lean \
              PCRLean/Experimental/CausalEventLedger.lean \
              PCRLean/Experimental/PolynomialGraphDebtCausalReentry.lean \
              PCRLean/Experimental/PolynomialGraphLocalResolutionMacro.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build integrated local macro index
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.GradedFrobeniusHeredityKernelIndex 2>&1 \
            | tee local-macro-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/GradedFrobeniusHeredityKernelIndexAudit.lean 2>&1 \
            | tee local-macro-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              local-macro-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: |
          git rev-parse HEAD | tee local-macro-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-local-macro-${{ github.sha }}
          path: |
            local-macro-build.txt
            local-macro-axioms.txt
            local-macro-commit.txt
          if-no-files-found: warn
