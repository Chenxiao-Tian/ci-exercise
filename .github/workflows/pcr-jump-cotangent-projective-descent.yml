name: PCR Jump projective conormal descent

on:
  push:
    branches:
      - pcr-jump-reduced-normal-cone-20260803
  pull_request:
    branches:
      - pcr-jump-integral-heredity-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-projective-conormal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  projective-conormal-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/FaithfullyFlatCotangentProjectiveDescent.lean \
              PCRLean/Experimental/FaithfullyFlatCotangentProjectiveDescentAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build projective conormal descent
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.FaithfullyFlatCotangentProjectiveDescent 2>&1 \
            | tee projective-conormal-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/FaithfullyFlatCotangentProjectiveDescentAudit.lean 2>&1 \
            | tee projective-conormal-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              projective-conormal-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-projective-conormal-${{ github.sha }}
          path: |
            projective-conormal-build.txt
            projective-conormal-axioms.txt
          if-no-files-found: warn
