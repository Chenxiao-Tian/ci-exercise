name: PCR Jump multi-owner dual Frobenius chamber

on:
  push:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-multi-owner-dual-frobenius-${{ github.sha }}
  cancel-in-progress: false

jobs:
  multi-owner-dual-frobenius-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/MultiOwnerHasseCore.lean \
              PCRLean/Experimental/DualPacketRegularCentre.lean \
              PCRLean/Experimental/DualPacketRootPackage.lean \
              PCRLean/Experimental/MultiOwnerDualFrobeniusChamber.lean \
              PCRLean/Experimental/MultiOwnerDualFrobeniusChamberAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build multi-owner dual Frobenius chamber
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.MultiOwnerDualFrobeniusChamber 2>&1 \
            | tee multi-owner-dual-frobenius-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/MultiOwnerDualFrobeniusChamberAudit.lean 2>&1 \
            | tee multi-owner-dual-frobenius-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              multi-owner-dual-frobenius-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-multi-owner-dual-frobenius-${{ github.sha }}
          path: |
            multi-owner-dual-frobenius-build.txt
            multi-owner-dual-frobenius-axioms.txt
          if-no-files-found: warn
