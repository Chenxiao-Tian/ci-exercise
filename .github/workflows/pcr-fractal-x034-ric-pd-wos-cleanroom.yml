name: PCR Fractal X034 regular-intersection clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x034-ric-pd-wos-base-20260804
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x034-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/TorExcessIsZeroExcess.lean
            PCRLean/Experimental/SplitExcessKernel.lean
            PCRLean/Experimental/ProjectivityDiscriminantPrime.lean
            PCRLean/Experimental/X034RegularIntersectionIndex.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            echo 'Forbidden placeholder or project axiom detected.'
            exit 1
          fi

      - name: Install pinned Lean toolchain through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned Lake manifest when absent
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if [[ ! -f lake-manifest.json ]]; then
            lake update
          fi
          test -f lake-manifest.json

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x034-evidence
          git rev-parse HEAD | tee x034-evidence/COMMIT.txt
          cat lean-toolchain | tee x034-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain \
            | tee x034-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x034-evidence/LEAN_VERSION.txt
          lake --version | tee x034-evidence/LAKE_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x034-evidence/LAKE_BUILD.log

      - name: Elaborate integrated X034 source
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X034RegularIntersectionIndex.lean \
            2>&1 | tee x034-evidence/X034_ELABORATION.log

      - name: Run unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X034RegularIntersectionIndexAudit.lean \
            2>&1 | tee x034-evidence/X034_AXIOM_AUDIT.log
          if grep -q 'sorryAx' x034-evidence/X034_AXIOM_AUDIT.log; then
            echo 'sorryAx detected in axiom output.'
            exit 1
          fi

      - name: Snapshot exact sources
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/TorExcessIsZeroExcess.lean x034-evidence/
          cp PCRLean/Experimental/SplitExcessKernel.lean x034-evidence/
          cp PCRLean/Experimental/ProjectivityDiscriminantPrime.lean x034-evidence/
          cp PCRLean/Experimental/X034RegularIntersectionIndex.lean x034-evidence/
          cp PCRLean/Experimental/X034RegularIntersectionIndexAudit.lean x034-evidence/
          cp PCRLean/ResearchRecords/MLEL_X034_RIC_PD_WOS_REPORT.md x034-evidence/
          cp PCRLean/ResearchRecords/MLEL_X034_ANNALS_SERIES_MLE.md x034-evidence/
          sha256sum x034-evidence/* | tee x034-evidence/X034_SOURCE_SHA256SUMS.txt

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X034-RIC-PD-WOS-EVIDENCE
          path: x034-evidence
          if-no-files-found: error
          retention-days: 90
