name: PCR Jump Fitting system globalization clean room

on:
  pull_request:
    branches:
      - pcr-jump-fitting-system-global-ci-base-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-fitting-system-global-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fitting-system-global-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders in the exact proof slice
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/GradedFrobeniusHeredityKernelIndex.lean \
              PCRLean/Experimental/GradedFrobeniusHeredityKernelIndexAudit.lean \
              PCRLean/Experimental/FittingMinorAtlas.lean \
              PCRLean/Experimental/FittingGraphCentreAtlas.lean \
              PCRLean/Experimental/FittingGraphCentreOverlap.lean \
              PCRLean/Experimental/FittingGraphCechEffectivity.lean \
              PCRLean/Experimental/FittingGraphSectionAtlas.lean \
              PCRLean/Experimental/FittingGraphRestrictionCompatibility.lean \
              PCRLean/Experimental/FittingGraphGlobalResolutionMacro.lean \
              PCRLean/Experimental/InvertibleLinearSystemGraph.lean \
              PCRLean/Experimental/DetUnitLinearSystemGraph.lean \
              PCRLean/Experimental/FittingLinearSystemAtlas.lean \
              PCRLean/Experimental/FittingLinearSystemOverlap.lean \
              PCRLean/Experimental/FittingLinearSystemGlobalResolutionMacro.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build integrated globalization index
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.GradedFrobeniusHeredityKernelIndex 2>&1 \
            | tee fitting-system-global-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/GradedFrobeniusHeredityKernelIndexAudit.lean 2>&1 \
            | tee fitting-system-global-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              fitting-system-global-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: |
          git rev-parse HEAD | tee fitting-system-global-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-fitting-system-global-${{ github.sha }}
          path: |
            fitting-system-global-build.txt
            fitting-system-global-axioms.txt
            fitting-system-global-commit.txt
          if-no-files-found: warn
