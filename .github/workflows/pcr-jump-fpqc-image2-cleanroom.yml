name: PCR Jump fpqc image-centre repaired clean room

on:
  pull_request:
    branches:
      - pcr-jump-fpqc-image2-ci-base-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-fpqc-image2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fpqc-image2-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders in exact proof slice
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/FPQCFittingImageCentreRoundIndex.lean \
              PCRLean/Experimental/FPQCFittingImageCentreRoundIndexAudit.lean \
              PCRLean/Experimental/MarkedPermissibilityFaithfullyFlatDescent.lean \
              PCRLean/Experimental/FaithfullyFlatGraphCentreCompiler.lean \
              PCRLean/Experimental/FrobeniusNormalBasicOpenDescent.lean \
              PCRLean/Experimental/MarkedPermissibilityBasicOpenDescent.lean \
              PCRLean/Experimental/FittingFrobeniusNormalCompiler.lean \
              PCRLean/Experimental/FittingCentreLegalityCompiler.lean \
              PCRLean/Experimental/FlatPassiveTorSafety.lean \
              PCRLean/Experimental/FittingFlatJointLegalityCompiler.lean \
              PCRLean/Experimental/PolynomialGraphBoundarySNC.lean \
              PCRLean/Experimental/ExceptionalDebtLineage.lean \
              PCRLean/Experimental/GraphDebtCleanupCompiler.lean \
              PCRLean/Experimental/ExceptionalDebtOverlapTransport.lean \
              PCRLean/Experimental/ExceptionalDebtOverlapCocycle.lean \
              PCRLean/Experimental/PolynomialGraphJointResolutionChamber.lean \
              PCRLean/Experimental/PolynomialGraphMarkBoundary.lean \
              PCRLean/Experimental/InvertibleMatrixGeneratorGauge.lean \
              PCRLean/Experimental/FittingGaugeCentreOverlap.lean \
              PCRLean/Experimental/HeterogeneousGeneratorGluing.lean \
              PCRLean/Experimental/ModuleImageCentre.lean \
              PCRLean/Experimental/ModuleImageGraphAtlas.lean \
              PCRLean/Experimental/OperatorOrbitImageCentre.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build integrated repaired round index
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.FPQCFittingImageCentreRoundIndex 2>&1 \
            | tee fpqc-image2-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/FPQCFittingImageCentreRoundIndexAudit.lean 2>&1 \
            | tee fpqc-image2-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              fpqc-image2-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: |
          git rev-parse HEAD | tee fpqc-image2-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-fpqc-image2-${{ github.sha }}
          path: |
            fpqc-image2-build.txt
            fpqc-image2-axioms.txt
            fpqc-image2-commit.txt
          if-no-files-found: warn
