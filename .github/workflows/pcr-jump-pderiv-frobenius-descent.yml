name: PCR Jump derivative-zero Frobenius descent

on:
  push:
    branches:
      - pcr-jump-hasse-zero-root-20260803
  pull_request:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-pderiv-frobenius-${{ github.sha }}
  cancel-in-progress: false

jobs:
  pderiv-frobenius-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/PDerivFrobeniusDescent.lean \
              PCRLean/Experimental/PDerivFrobeniusDescentAudit.lean \
              PCRLean/Experimental/FrobeniusPrimitiveDecomposition.lean \
              PCRLean/Experimental/FrobeniusPrimitiveDecompositionAudit.lean \
              PCRLean/Experimental/DerivativeZeroFinitePresentation.lean \
              PCRLean/Experimental/DerivativeZeroFinitePresentationAudit.lean \
              PCRLean/Experimental/InitialFormFrobeniusCleaning.lean \
              PCRLean/Experimental/InitialFormFrobeniusCleaningAudit.lean \
              PCRLean/Experimental/InitialFormCleaningTermination.lean \
              PCRLean/Experimental/InitialFormCleaningTerminationAudit.lean \
              PCRLean/Experimental/ReesFrobeniusIntegralCompression.lean \
              PCRLean/Experimental/ReesFrobeniusIntegralCompressionAudit.lean \
              PCRLean/Experimental/FiniteReesFrobeniusCompression.lean \
              PCRLean/Experimental/FiniteReesFrobeniusCompressionAudit.lean \
              PCRLean/Experimental/FiniteHasseIntegralCompression.lean \
              PCRLean/Experimental/FiniteHasseIntegralCompressionAudit.lean \
              PCRLean/Experimental/IntegralEquivalentReesPresentations.lean \
              PCRLean/Experimental/IntegralEquivalentReesPresentationsAudit.lean \
              PCRLean/Experimental/PolynomialHasseFrobenius.lean \
              PCRLean/Experimental/PolynomialHasseFrobeniusAudit.lean \
              PCRLean/Experimental/UnivariateHasseIntegralCompression.lean \
              PCRLean/Experimental/UnivariateHasseIntegralCompressionAudit.lean \
              PCRLean/Experimental/RankZeroFrobeniusReesExit.lean \
              PCRLean/Experimental/RankZeroFrobeniusReesExitAudit.lean \
              PCRLean/Experimental/ImperfectCoefficientObstruction.lean \
              PCRLean/Experimental/ImperfectCoefficientObstructionAudit.lean \
              PCRLean/Experimental/RankZeroFrobeniusReesKernelIndex.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build derivative-zero descent
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.PDerivFrobeniusDescent 2>&1 \
            | tee pderiv-frobenius-build.txt
      - name: Build primitive decomposition
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.FrobeniusPrimitiveDecomposition 2>&1 \
            | tee frobenius-primitive-build.txt
      - name: Build finite presentation descent
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.DerivativeZeroFinitePresentation 2>&1 \
            | tee derivative-zero-presentation-build.txt
      - name: Build initial-form cleaning
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.InitialFormFrobeniusCleaning 2>&1 \
            | tee initial-form-cleaning-build.txt
      - name: Build cleaning termination
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.InitialFormCleaningTermination 2>&1 \
            | tee cleaning-termination-build.txt
      - name: Build Rees integral compression
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.ReesFrobeniusIntegralCompression 2>&1 \
            | tee rees-integral-compression-build.txt
      - name: Build finite Rees compression
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.FiniteReesFrobeniusCompression 2>&1 \
            | tee finite-rees-compression-build.txt
      - name: Build finite Hasse compression
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.FiniteHasseIntegralCompression 2>&1 \
            | tee finite-hasse-compression-build.txt
      - name: Build integral-equivalent presentation language
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.IntegralEquivalentReesPresentations 2>&1 \
            | tee integral-equivalent-presentations-build.txt
      - name: Build polynomial Hasse-Frobenius identity
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.PolynomialHasseFrobenius 2>&1 \
            | tee polynomial-hasse-frobenius-build.txt
      - name: Build concrete univariate Hasse compression
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.UnivariateHasseIntegralCompression 2>&1 \
            | tee univariate-hasse-compression-build.txt
      - name: Build combined rank-zero exit
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.RankZeroFrobeniusReesExit 2>&1 \
            | tee rank-zero-exit-build.txt
      - name: Build imperfect-field no-go
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.ImperfectCoefficientObstruction 2>&1 \
            | tee imperfect-obstruction-build.txt
      - name: Build integrated index
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.RankZeroFrobeniusReesKernelIndex 2>&1 \
            | tee integrated-index-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          for audit in \
            PDerivFrobeniusDescentAudit \
            FrobeniusPrimitiveDecompositionAudit \
            DerivativeZeroFinitePresentationAudit \
            InitialFormFrobeniusCleaningAudit \
            InitialFormCleaningTerminationAudit \
            ReesFrobeniusIntegralCompressionAudit \
            FiniteReesFrobeniusCompressionAudit \
            FiniteHasseIntegralCompressionAudit \
            IntegralEquivalentReesPresentationsAudit \
            PolynomialHasseFrobeniusAudit \
            UnivariateHasseIntegralCompressionAudit \
            RankZeroFrobeniusReesExitAudit \
            ImperfectCoefficientObstructionAudit; do
              lake env lean "PCRLean/Experimental/${audit}.lean" 2>&1 \
                | tee "${audit}-axioms.txt"
          done
          cat *-axioms.txt > combined-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              combined-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-pderiv-frobenius-${{ github.sha }}
          path: |
            *-build.txt
            *-axioms.txt
            combined-axioms.txt
          if-no-files-found: warn
