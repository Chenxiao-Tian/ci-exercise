name: PCR Fractal X038 purification-grading clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x038-pgi-erd-base-20260804
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x038-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/ExceptionalTorsionLayers.lean
            PCRLean/Experimental/NestedPurificationQuotient.lean
            PCRLean/Experimental/ArtinReesTailCompiler.lean
            PCRLean/Experimental/ExceptionalInterchangeRank.lean
            PCRLean/Experimental/X038PurificationGradingInterchangeIndex.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            echo 'Forbidden placeholder or project axiom detected.'
            exit 1
          fi

      - name: Install pinned Lean toolchain through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned Lake manifest when absent
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if [[ ! -f lake-manifest.json ]]; then
            lake update
          fi
          test -f lake-manifest.json

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x038-evidence
          git rev-parse HEAD | tee x038-evidence/COMMIT.txt
          cat lean-toolchain | tee x038-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain \
            | tee x038-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x038-evidence/LEAN_VERSION.txt
          lake --version | tee x038-evidence/LAKE_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x038-evidence/LAKE_BUILD.log

      - name: Build exact X038 module targets
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          modules=(
            PCRLean.Experimental.ExceptionalTorsionLayers
            PCRLean.Experimental.NestedPurificationQuotient
            PCRLean.Experimental.ArtinReesTailCompiler
            PCRLean.Experimental.ExceptionalInterchangeRank
            PCRLean.Experimental.X038PurificationGradingInterchangeIndex
          )
          : > x038-evidence/X038_ELABORATION.log
          for module in "${modules[@]}"; do
            echo "===== ${module} =====" | tee -a x038-evidence/X038_ELABORATION.log
            lake build "$module" 2>&1 | tee -a x038-evidence/X038_ELABORATION.log
          done

      - name: Run unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X038PurificationGradingInterchangeIndexAudit.lean \
            2>&1 | tee x038-evidence/X038_AXIOM_AUDIT.log
          if grep -q 'sorryAx' x038-evidence/X038_AXIOM_AUDIT.log; then
            echo 'sorryAx detected in axiom output.'
            exit 1
          fi

      - name: Snapshot exact sources
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/ExceptionalTorsionLayers.lean x038-evidence/
          cp PCRLean/Experimental/NestedPurificationQuotient.lean x038-evidence/
          cp PCRLean/Experimental/ArtinReesTailCompiler.lean x038-evidence/
          cp PCRLean/Experimental/ExceptionalInterchangeRank.lean x038-evidence/
          cp PCRLean/Experimental/X038PurificationGradingInterchangeIndex.lean x038-evidence/
          cp PCRLean/Experimental/X038PurificationGradingInterchangeIndexAudit.lean x038-evidence/
          cp PCRLean/ResearchRecords/MLEL_X038_PGI_ERD_REPORT.md x038-evidence/
          cp PCRLean/ResearchRecords/MLEL_X038_FILTER_REGULARITY_SUPPLEMENT.md x038-evidence/
          cp PCRLean/ResearchRecords/MLEL_X038_ANNALS_SERIES_MLE.md x038-evidence/
          sha256sum x038-evidence/* | tee x038-evidence/X038_SOURCE_SHA256SUMS.txt

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X038-PGI-ERD-EVIDENCE
          path: x038-evidence
          if-no-files-found: error
          retention-days: 90
