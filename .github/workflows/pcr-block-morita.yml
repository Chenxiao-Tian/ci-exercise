name: PCR Block Morita verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-block-morita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  block-morita-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/BlockMatrixStableSubmodule.lean \
              PCRLean/BlockMoritaAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build and audit block Morita descent
        run: |
          set -o pipefail
          lake build PCRLean.BlockMatrixStableSubmodule 2>&1 | tee block-morita-build.txt
          lake env lean PCRLean/BlockMoritaAudit.lean 2>&1 | tee block-morita-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              block-morita-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-block-morita-audit
          path: |
            block-morita-build.txt
            block-morita-axioms.txt
          if-no-files-found: warn
