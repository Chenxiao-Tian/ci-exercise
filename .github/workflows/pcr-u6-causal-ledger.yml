name: PCR U6 causal event ledger

on:
  push:
    branches:
      - pcr-u6-causal-ledger-20260803
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pcr-u6-causal-ledger-${{ github.sha }}
  cancel-in-progress: false

jobs:
  u6-causal-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - id: placeholders
        name: Reject placeholders
        continue-on-error: true
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/CausalEventLedger.lean \
              PCRLean/Experimental/CausalEventLedgerAudit.lean \
              | tee u6-placeholders.txt; then
            exit 1
          fi
      - id: build
        name: Build actual finite-source ledger descent
        continue-on-error: true
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.CausalEventLedger 2>&1 \
            | tee u6-build.txt
      - id: audit
        name: Axiom audit
        continue-on-error: true
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/CausalEventLedgerAudit.lean 2>&1 \
            | tee u6-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              u6-axioms.txt; then
            exit 1
          fi
      - name: Write result certificate
        if: always()
        env:
          PLACEHOLDERS: ${{ steps.placeholders.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          result=PCRLean/Experimental/U6_CAUSAL_LEDGER_CI_RESULT.md
          {
            echo '# U6 Causal Ledger CI Result'
            echo
            echo "- source commit: \`${GITHUB_SHA}\`"
            echo "- workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- placeholder rejection: ${PLACEHOLDERS}"
            echo "- build: ${BUILD}"
            echo "- axiom audit: ${AUDIT}"
            for f in u6-placeholders.txt u6-build.txt u6-axioms.txt; do
              if [ -f "$f" ]; then
                echo
                echo "## ${f}"
                echo '```text'
                tail -n 120 "$f"
                echo '```'
              fi
            done
          } > "$result"
          git config user.name 'PCR Lean CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "$result"
          git commit -m 'PCR U6 CI: record causal ledger result' || true
          git push origin HEAD:pcr-u6-causal-ledger-20260803
      - name: Enforce success
        if: always()
        env:
          PLACEHOLDERS: ${{ steps.placeholders.outcome }}
          BUILD: ${{ steps.build.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          test "$PLACEHOLDERS" = success
          test "$BUILD" = success
          test "$AUDIT" = success
