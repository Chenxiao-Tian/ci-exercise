name: PCR Jump finite-packet centre order

on:
  push:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-finite-packet-centre-order-${{ github.sha }}
  cancel-in-progress: false

jobs:
  finite-packet-centre-order-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/IntrinsicKernelIdealFunctoriality.lean \
              PCRLean/Experimental/IntrinsicKernelIdealMonotonicity.lean \
              PCRLean/Experimental/IntrinsicKernelIdealMonotonicityAudit.lean \
              PCRLean/Experimental/FinitePacketAutomaticRegularCentre.lean \
              PCRLean/Experimental/FinitePacketCentreAntitone.lean \
              PCRLean/Experimental/FinitePacketCentreAntitoneAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build finite-packet centre order
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.FinitePacketCentreAntitone 2>&1 \
            | tee finite-packet-centre-order-build.txt
      - name: Kernel axiom audits
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/IntrinsicKernelIdealMonotonicityAudit.lean 2>&1 \
            | tee intrinsic-kernel-monotonicity-axioms.txt
          lake env lean PCRLean/Experimental/FinitePacketCentreAntitoneAudit.lean 2>&1 \
            | tee finite-packet-centre-antitone-axioms.txt
          cat intrinsic-kernel-monotonicity-axioms.txt \
              finite-packet-centre-antitone-axioms.txt > centre-order-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              centre-order-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-finite-packet-centre-order-${{ github.sha }}
          path: |
            finite-packet-centre-order-build.txt
            intrinsic-kernel-monotonicity-axioms.txt
            finite-packet-centre-antitone-axioms.txt
            centre-order-axioms.txt
          if-no-files-found: warn
