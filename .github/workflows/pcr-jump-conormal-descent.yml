name: PCR Jump faithful-flat conormal descent

on:
  push:
    branches:
      - pcr-jump-reduced-normal-cone-20260803
  pull_request:
    branches:
      - pcr-jump-integral-heredity-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-conormal-descent-${{ github.sha }}
  cancel-in-progress: false

jobs:
  conormal-descent-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/FaithfullyFlatCotangentFinitenessDescent.lean \
              PCRLean/Experimental/FaithfullyFlatCotangentFinitenessDescentAudit.lean \
              PCRLean/Experimental/FaithfullyFlatConormalDescentKernelIndex.lean \
              PCRLean/Experimental/FaithfullyFlatConormalDescentKernelIndexAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build conormal descent index
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.FaithfullyFlatConormalDescentKernelIndex 2>&1 \
            | tee conormal-descent-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/FaithfullyFlatCotangentFinitenessDescentAudit.lean 2>&1 \
            | tee cotangent-finiteness-axioms.txt
          lake env lean PCRLean/Experimental/FaithfullyFlatConormalDescentKernelIndexAudit.lean 2>&1 \
            | tee conormal-descent-index-axioms.txt
          cat *-axioms.txt > combined-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              combined-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-conormal-descent-${{ github.sha }}
          path: |
            conormal-descent-build.txt
            *-axioms.txt
            combined-axioms.txt
          if-no-files-found: warn
