name: PCR Passive Morita verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-passive-morita-${{ github.ref }}
  cancel-in-progress: true

jobs:
  passive-morita-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/BlockMatrixStableSubmodule.lean \
              PCRLean/PassiveHasseMoritaDescent.lean \
              PCRLean/PassiveMoritaAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build and audit passive Morita descent
        run: |
          set -o pipefail
          lake build PCRLean.PassiveHasseMoritaDescent 2>&1 | tee passive-morita-build.txt
          lake env lean PCRLean/PassiveMoritaAudit.lean 2>&1 | tee passive-morita-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              passive-morita-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-passive-morita-audit
          path: |
            passive-morita-build.txt
            passive-morita-axioms.txt
          if-no-files-found: warn
