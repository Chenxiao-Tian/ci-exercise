name: PCR Jump maximal-minor range clean room

on:
  pull_request:
    branches:
      - pcr-jump-maximal-range-ci-base-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-maximal-range-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maximal-range-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders in focused proof slice
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/FittingMinorFaithfulCover.lean \
              PCRLean/Experimental/AugmentedMinorRangeNecessity.lean \
              PCRLean/Experimental/MaximalMinorRangeCriterion.lean \
              PCRLean/Experimental/MaximalMinorGlobalResolutionMacro.lean \
              PCRLean/Experimental/MaximalMinorPresentationIndependence.lean \
              PCRLean/Experimental/PolynomialGraphSupportEquality.lean \
              PCRLean/Experimental/PolynomialGraphActionBoundary.lean \
              PCRLean/Experimental/MaximalMinorResolutionKernelIndex.lean \
              PCRLean/Experimental/MaximalMinorResolutionKernelIndexAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build focused maximal-minor index
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.MaximalMinorResolutionKernelIndex 2>&1 \
            | tee maximal-range-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/MaximalMinorResolutionKernelIndexAudit.lean 2>&1 \
            | tee maximal-range-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              maximal-range-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: |
          git rev-parse HEAD | tee maximal-range-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-maximal-range-${{ github.sha }}
          path: |
            maximal-range-build.txt
            maximal-range-axioms.txt
            maximal-range-commit.txt
          if-no-files-found: warn
