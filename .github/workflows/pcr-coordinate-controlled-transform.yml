name: PCR Coordinate Controlled Transform verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-coordinate-controlled-transform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coordinate-controlled-transform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/CoordinateBlowupChart.lean \
              PCRLean/CoordinateControlledTransform.lean \
              PCRLean/CoordinateControlledTransformAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build and audit controlled transforms
        run: |
          set -o pipefail
          lake build PCRLean.CoordinateControlledTransform 2>&1 | tee controlled-transform-build.txt
          lake env lean PCRLean/CoordinateControlledTransformAudit.lean 2>&1 | tee controlled-transform-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              controlled-transform-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-coordinate-controlled-transform-audit
          path: |
            controlled-transform-build.txt
            controlled-transform-axioms.txt
          if-no-files-found: warn
