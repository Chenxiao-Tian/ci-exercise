name: PCR Fractal X032 canonical minimizer symmetry clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x032-cms-nes-base-20260803
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x032-cms-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Reject placeholders and project axioms in X032 CMS slice
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/CanonicalMarkedMinimizerSpace.lean
            PCRLean/Experimental/TwoChoiceMarkedMinimizerNoGo.lean
            PCRLean/Experimental/X032CanonicalMinimizerSymmetryIndex.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            echo 'Forbidden placeholder or project axiom detected.'
            exit 1
          fi

      - name: Install pinned Lean toolchain through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x032-cms-evidence
          git rev-parse HEAD | tee x032-cms-evidence/COMMIT.txt
          cat lean-toolchain | tee x032-cms-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain \
            | tee x032-cms-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x032-cms-evidence/LEAN_VERSION.txt
          lake --version | tee x032-cms-evidence/LAKE_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x032-cms-evidence/LAKE_BUILD.log

      - name: Elaborate integrated X032 CMS source slice
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X032CanonicalMinimizerSymmetryIndex.lean \
            2>&1 | tee x032-cms-evidence/X032_CMS_ELABORATION.log

      - name: Run unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X032CanonicalMinimizerSymmetryIndexAudit.lean \
            2>&1 | tee x032-cms-evidence/X032_CMS_AXIOM_AUDIT.log
          if grep -q 'sorryAx' x032-cms-evidence/X032_CMS_AXIOM_AUDIT.log; then
            echo 'sorryAx detected in axiom output.'
            exit 1
          fi

      - name: Snapshot X032 CMS sources
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/CanonicalMarkedMinimizerSpace.lean x032-cms-evidence/
          cp PCRLean/Experimental/TwoChoiceMarkedMinimizerNoGo.lean x032-cms-evidence/
          cp PCRLean/Experimental/X032CanonicalMinimizerSymmetryIndex.lean x032-cms-evidence/
          cp PCRLean/Experimental/X032CanonicalMinimizerSymmetryIndexAudit.lean x032-cms-evidence/
          sha256sum x032-cms-evidence/*.lean \
            | tee x032-cms-evidence/X032_CMS_SOURCE_SHA256SUMS.txt

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X032-CMS-NES-EVIDENCE
          path: x032-cms-evidence
          if-no-files-found: error
          retention-days: 90
