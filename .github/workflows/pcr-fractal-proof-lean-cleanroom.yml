name: PCR Fractal Proof Lean architecture clean room

on:
  pull_request:
    branches:
      - pcr-fractal-proof-lean-ci-base-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-fractal-proof-lean-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fractal-proof-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/ProofArchitecture/FractalProofEngine.lean \
              PCRLean/ProofArchitecture/FractalProofEngineAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build generic closure engine
        run: |
          set -o pipefail
          lake build PCRLean.ProofArchitecture.FractalProofEngine 2>&1 \
            | tee fractal-proof-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/ProofArchitecture/FractalProofEngineAudit.lean 2>&1 \
            | tee fractal-proof-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              fractal-proof-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: |
          git rev-parse HEAD | tee fractal-proof-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-fractal-proof-lean-${{ github.sha }}
          path: |
            fractal-proof-build.txt
            fractal-proof-axioms.txt
            fractal-proof-commit.txt
          if-no-files-found: warn
