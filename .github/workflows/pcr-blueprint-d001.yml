name: PCR MLEL-D001 proof architecture clean room

on:
  push:
    branches:
      - pcr-blueprint-d001-20260803
  pull_request:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-blueprint-d001-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  architecture-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders and project axioms
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Blueprint/FinalProofBlueprint.lean \
              PCRLean/Blueprint/FinalProofBlueprintAudit.lean; then
            echo 'Forbidden placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build architecture topology
        run: |
          set -o pipefail
          lake build PCRLean.Blueprint.FinalProofBlueprint 2>&1 \
            | tee d001-blueprint-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Blueprint/FinalProofBlueprintAudit.lean 2>&1 \
            | tee d001-blueprint-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              d001-blueprint-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: git rev-parse HEAD | tee d001-blueprint-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-mlel-d001-blueprint-${{ github.sha }}
          path: |
            d001-blueprint-build.txt
            d001-blueprint-axioms.txt
            d001-blueprint-commit.txt
          if-no-files-found: warn
