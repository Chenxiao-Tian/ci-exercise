name: PCR U2 surjective regular centre

on:
  push:
    branches:
      - pcr-u2-surjective-regular-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-u2-surjective-regular-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surjective-regular-centre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/SplitSurjectionSymmetricQuotient.lean \
              PCRLean/Experimental/SplitSurjectionActualCentre.lean \
              PCRLean/Experimental/SplitSurjectionRegularCentre.lean \
              PCRLean/Experimental/SurjectiveLinearMapRegularCentre.lean \
              PCRLean/Experimental/SurjectiveLinearMapRegularCentreAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build surjective regular centre
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.SurjectiveLinearMapRegularCentre 2>&1 \
            | tee surjective-regular-centre-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/SurjectiveLinearMapRegularCentreAudit.lean 2>&1 \
            | tee surjective-regular-centre-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              surjective-regular-centre-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-u2-surjective-regular-${{ github.sha }}
          path: |
            surjective-regular-centre-build.txt
            surjective-regular-centre-axioms.txt
          if-no-files-found: warn
