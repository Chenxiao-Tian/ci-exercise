name: PCR Jump integral-heredity PR validation

on:
  pull_request:
    branches:
      - pcr-jump-heredity-ci-base-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-integral-heredity-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  order-heredity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/UnivariateFrobeniusOrderHeredity.lean \
              PCRLean/Experimental/UnivariateFrobeniusOrderHeredityAudit.lean \
              PCRLean/Experimental/FrobeniusMarkScalingBoundary.lean \
              PCRLean/Experimental/FrobeniusMarkScalingBoundaryAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build order heredity bridge
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.UnivariateFrobeniusOrderHeredity 2>&1 \
            | tee integral-heredity-build.txt
      - name: Build finite-family and boundary bridge
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.FrobeniusMarkScalingBoundary 2>&1 \
            | tee mark-scaling-boundary-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/UnivariateFrobeniusOrderHeredityAudit.lean 2>&1 \
            | tee integral-heredity-axioms.txt
          lake env lean PCRLean/Experimental/FrobeniusMarkScalingBoundaryAudit.lean 2>&1 \
            | tee mark-scaling-boundary-axioms.txt
          cat integral-heredity-axioms.txt mark-scaling-boundary-axioms.txt \
            > combined-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              combined-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-integral-heredity-${{ github.sha }}
          path: |
            integral-heredity-build.txt
            mark-scaling-boundary-build.txt
            integral-heredity-axioms.txt
            mark-scaling-boundary-axioms.txt
            combined-axioms.txt
          if-no-files-found: warn
