name: PCR Lean closed-loop verification

on:
  push:
    branches: ["pcr-lean-closed-loop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          leanchecker: false
          nanoda: false

      - name: Resolve pinned dependencies
        run: lake update

      - name: Download mathlib compiled cache
        run: lake exe cache get

      - name: Build the complete PCRLean library
        run: lake build

      - name: Reject proof placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          bad="$(find PCRLean -name '*.lean' -print0 | xargs -0 grep -nE '^[[:space:]]*(sorry|admit|axiom)([[:space:]]|$)' || true)"
          if [[ -n "$bad" ]]; then
            echo "$bad"
            echo "Forbidden proof placeholder or custom axiom found."
            exit 1
          fi

      - name: Re-run certified axiom audit explicitly
        run: lake env lean PCRLean/Certified/CertifiedIndex.lean

      - name: Independent leanchecker and nanoda verification
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false
