name: PCR Hasse Core verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-hasse-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hasse-core-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/MonogenicFrobeniusFrame.lean \
              PCRLean/AdjoinRootFrobeniusFrame.lean \
              PCRLean/HasseSaturationDescent.lean \
              PCRLean/HasseGrowthDescentDichotomy.lean \
              PCRLean/HasseCoreAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build Hasse-core chain
        run: |
          set -o pipefail
          lake build PCRLean.MonogenicFrobeniusFrame 2>&1 | tee hasse-core-build.txt
          lake build PCRLean.AdjoinRootFrobeniusFrame 2>&1 | tee -a hasse-core-build.txt
          lake build PCRLean.HasseSaturationDescent 2>&1 | tee -a hasse-core-build.txt
          lake build PCRLean.HasseGrowthDescentDichotomy 2>&1 | tee -a hasse-core-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/HasseCoreAudit.lean 2>&1 | tee hasse-core-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              hasse-core-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-hasse-core-audit
          path: |
            hasse-core-build.txt
            hasse-core-axioms.txt
          if-no-files-found: warn
