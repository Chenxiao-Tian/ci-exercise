name: PCR Fractal X039 normal-flatness transitivity clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x039-ntr-rfl-base-20260804
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x039-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/HironakaTensorFlatnessCompiler.lean
            PCRLean/Experimental/ExceptionalNoRecharge.lean
            PCRLean/Experimental/NestedCarrierLegalizationRank.lean
            PCRLean/Experimental/X039NormalFlatnessTransitivityIndex.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            echo 'Forbidden placeholder or project axiom detected.'
            exit 1
          fi

      - name: Install pinned Lean toolchain through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned Lake manifest when absent
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if [[ ! -f lake-manifest.json ]]; then
            lake update
          fi
          test -f lake-manifest.json

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x039-evidence
          git rev-parse HEAD | tee x039-evidence/COMMIT.txt
          cat lean-toolchain | tee x039-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain \
            | tee x039-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x039-evidence/LEAN_VERSION.txt
          lake --version | tee x039-evidence/LAKE_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x039-evidence/LAKE_BUILD.log

      - name: Build exact X039 module targets
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          modules=(
            PCRLean.Experimental.HironakaTensorFlatnessCompiler
            PCRLean.Experimental.ExceptionalNoRecharge
            PCRLean.Experimental.NestedCarrierLegalizationRank
            PCRLean.Experimental.X039NormalFlatnessTransitivityIndex
          )
          : > x039-evidence/X039_ELABORATION.log
          for module in "${modules[@]}"; do
            echo "===== ${module} =====" | tee -a x039-evidence/X039_ELABORATION.log
            lake build "$module" 2>&1 | tee -a x039-evidence/X039_ELABORATION.log
          done

      - name: Run unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X039NormalFlatnessTransitivityIndexAudit.lean \
            2>&1 | tee x039-evidence/X039_AXIOM_AUDIT.log
          if grep -q 'sorryAx' x039-evidence/X039_AXIOM_AUDIT.log; then
            echo 'sorryAx detected in axiom output.'
            exit 1
          fi

      - name: Snapshot exact sources and protocol artifacts
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/HironakaTensorFlatnessCompiler.lean x039-evidence/
          cp PCRLean/Experimental/ExceptionalNoRecharge.lean x039-evidence/
          cp PCRLean/Experimental/NestedCarrierLegalizationRank.lean x039-evidence/
          cp PCRLean/Experimental/X039NormalFlatnessTransitivityIndex.lean x039-evidence/
          cp PCRLean/Experimental/X039NormalFlatnessTransitivityIndexAudit.lean x039-evidence/
          cp PCRLean/ResearchRecords/MLEL_X039_NTR_RFL_REPORT.md x039-evidence/
          cp PCRLean/ResearchRecords/MLEL_X039_ANNALS_SERIES_MLE.md x039-evidence/
          cp -R PCRLean/ResearchRecords/X039Artifacts x039-evidence/
          find x039-evidence -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | tee x039-evidence/X039_SOURCE_SHA256SUMS.txt

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X039-NTR-RFL-EVIDENCE
          path: x039-evidence
          if-no-files-found: error
          retention-days: 90
