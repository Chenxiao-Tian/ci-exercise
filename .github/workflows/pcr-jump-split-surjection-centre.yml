name: PCR Jump split-surjection actual centre

on:
  push:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-split-surjection-centre-${{ github.sha }}
  cancel-in-progress: false

jobs:
  split-surjection-centre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/SplitSurjectionSymmetricQuotient.lean \
              PCRLean/Experimental/SplitSurjectionActualCentre.lean \
              PCRLean/Experimental/SplitSurjectionActualCentreAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build actual-centre certificate
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.SplitSurjectionActualCentre 2>&1 \
            | tee split-surjection-centre-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/SplitSurjectionActualCentreAudit.lean 2>&1 \
            | tee split-surjection-centre-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              split-surjection-centre-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-split-surjection-centre-${{ github.sha }}
          path: |
            split-surjection-centre-build.txt
            split-surjection-centre-axioms.txt
          if-no-files-found: warn
