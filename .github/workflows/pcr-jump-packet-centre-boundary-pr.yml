name: PCR Jump packet-centre boundary PR audit

on:
  pull_request:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-packet-centre-boundary-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packet-centre-boundary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/PacketCentreBoundary.lean \
              PCRLean/Experimental/PacketCentreBoundaryAudit.lean \
              PCRLean/Experimental/HybridDefectRootCusp.lean \
              PCRLean/Experimental/HybridDefectRootCuspAudit.lean \
              PCRLean/Experimental/HybridMarkedSynthesis.lean \
              PCRLean/Experimental/HybridMarkedSynthesisAudit.lean \
              PCRLean/Experimental/MinimalHybridCentre.lean \
              PCRLean/Experimental/MinimalHybridCentreAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build packet-centre boundary
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.PacketCentreBoundary 2>&1 \
            | tee packet-centre-boundary-build.txt
      - name: Audit packet-centre boundary
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/PacketCentreBoundaryAudit.lean 2>&1 \
            | tee packet-centre-boundary-axioms.txt
      - name: Build hybrid marked synthesis
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.HybridMarkedSynthesis 2>&1 \
            | tee hybrid-marked-synthesis-build.txt
      - name: Audit hybrid marked synthesis
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/HybridMarkedSynthesisAudit.lean 2>&1 \
            | tee hybrid-marked-synthesis-axioms.txt
      - name: Build hybrid defect-root cusp
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.HybridDefectRootCusp 2>&1 \
            | tee hybrid-defect-root-build.txt
      - name: Audit hybrid defect-root cusp
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/HybridDefectRootCuspAudit.lean 2>&1 \
            | tee hybrid-defect-root-axioms.txt
      - name: Build minimal hybrid compiler
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.MinimalHybridCentre 2>&1 \
            | tee minimal-hybrid-centre-build.txt
      - name: Audit minimal hybrid compiler
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/MinimalHybridCentreAudit.lean 2>&1 \
            | tee minimal-hybrid-centre-axioms.txt
      - name: Reject unpermitted axioms
        run: |
          set -o pipefail
          cat *-axioms.txt > combined-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              combined-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: printf '%s\n' "${GITHUB_SHA}" > exact-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-packet-centre-boundary-${{ github.sha }}
          path: |
            *-build.txt
            *-axioms.txt
            combined-axioms.txt
            exact-commit.txt
          if-no-files-found: warn
