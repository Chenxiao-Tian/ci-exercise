name: PCR Jump packet-centre boundary PR audit

on:
  pull_request:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-packet-centre-boundary-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packet-centre-boundary-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/PacketCentreBoundary.lean \
              PCRLean/Experimental/PacketCentreBoundaryAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build packet-centre boundary
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.PacketCentreBoundary 2>&1 \
            | tee packet-centre-boundary-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/PacketCentreBoundaryAudit.lean 2>&1 \
            | tee packet-centre-boundary-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              packet-centre-boundary-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: printf '%s\n' "${GITHUB_SHA}" > packet-centre-boundary-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-packet-centre-boundary-${{ github.sha }}
          path: |
            packet-centre-boundary-build.txt
            packet-centre-boundary-axioms.txt
            packet-centre-boundary-commit.txt
          if-no-files-found: warn
