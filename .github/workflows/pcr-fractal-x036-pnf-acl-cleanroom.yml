name: PCR Fractal X036 projective-normal legalization clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x036-pnf-acl-base-20260804
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x036-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/FiniteGradedFlatnessCompiler.lean
            PCRLean/Experimental/FinitePassivePortfolio.lean
            PCRLean/Experimental/AnchorContactCleaning.lean
            PCRLean/Experimental/LegalizationPhaseRank.lean
            PCRLean/Experimental/X036ProjectiveNormalLegalizationIndex.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            echo 'Forbidden placeholder or project axiom detected.'
            exit 1
          fi

      - name: Install pinned Lean toolchain through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Bootstrap pinned Lake manifest when absent
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          if [[ ! -f lake-manifest.json ]]; then
            lake update
          fi
          test -f lake-manifest.json

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x036-evidence
          git rev-parse HEAD | tee x036-evidence/COMMIT.txt
          cat lean-toolchain | tee x036-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain \
            | tee x036-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x036-evidence/LEAN_VERSION.txt
          lake --version | tee x036-evidence/LAKE_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x036-evidence/LAKE_BUILD.log

      - name: Build exact X036 module targets
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          modules=(
            PCRLean.Experimental.FiniteGradedFlatnessCompiler
            PCRLean.Experimental.FinitePassivePortfolio
            PCRLean.Experimental.AnchorContactCleaning
            PCRLean.Experimental.LegalizationPhaseRank
            PCRLean.Experimental.X036ProjectiveNormalLegalizationIndex
          )
          : > x036-evidence/X036_ELABORATION.log
          for module in "${modules[@]}"; do
            echo "===== ${module} =====" | tee -a x036-evidence/X036_ELABORATION.log
            lake build "$module" 2>&1 | tee -a x036-evidence/X036_ELABORATION.log
          done

      - name: Run unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X036ProjectiveNormalLegalizationIndexAudit.lean \
            2>&1 | tee x036-evidence/X036_AXIOM_AUDIT.log
          if grep -q 'sorryAx' x036-evidence/X036_AXIOM_AUDIT.log; then
            echo 'sorryAx detected in axiom output.'
            exit 1
          fi

      - name: Snapshot exact sources
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/FiniteGradedFlatnessCompiler.lean x036-evidence/
          cp PCRLean/Experimental/FinitePassivePortfolio.lean x036-evidence/
          cp PCRLean/Experimental/AnchorContactCleaning.lean x036-evidence/
          cp PCRLean/Experimental/LegalizationPhaseRank.lean x036-evidence/
          cp PCRLean/Experimental/X036ProjectiveNormalLegalizationIndex.lean x036-evidence/
          cp PCRLean/Experimental/X036ProjectiveNormalLegalizationIndexAudit.lean x036-evidence/
          cp PCRLean/ResearchRecords/MLEL_X036_PNF_ACL_REPORT.md x036-evidence/
          cp PCRLean/ResearchRecords/MLEL_X036_ANNALS_SERIES_MLE.md x036-evidence/
          sha256sum x036-evidence/* | tee x036-evidence/X036_SOURCE_SHA256SUMS.txt

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X036-PNF-ACL-EVIDENCE
          path: x036-evidence
          if-no-files-found: error
          retention-days: 90
