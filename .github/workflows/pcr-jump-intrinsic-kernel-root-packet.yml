name: PCR Jump intrinsic kernel root packet

on:
  push:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-intrinsic-kernel-root-packet-${{ github.sha }}
  cancel-in-progress: false

jobs:
  intrinsic-kernel-root-packet-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/IntrinsicKernelIdealFunctoriality.lean \
              PCRLean/Experimental/IntrinsicKernelIdealExactSquare.lean \
              PCRLean/Experimental/IntrinsicKernelRootPacket.lean \
              PCRLean/Experimental/IntrinsicKernelRootPacketAudit.lean \
              PCRLean/Experimental/IntrinsicKernelRootPacketExactSquare.lean \
              PCRLean/Experimental/IntrinsicKernelRootPacketExactSquareAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build intrinsic root-packet transport
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.IntrinsicKernelRootPacketExactSquare 2>&1 \
            | tee intrinsic-kernel-root-packet-build.txt
      - name: Kernel axiom audits
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/IntrinsicKernelRootPacketAudit.lean 2>&1 \
            | tee intrinsic-kernel-root-packet-axioms.txt
          lake env lean PCRLean/Experimental/IntrinsicKernelRootPacketExactSquareAudit.lean 2>&1 \
            | tee intrinsic-kernel-root-packet-exact-square-axioms.txt
          cat intrinsic-kernel-root-packet-axioms.txt \
              intrinsic-kernel-root-packet-exact-square-axioms.txt \
              > intrinsic-root-packet-all-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              intrinsic-root-packet-all-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-intrinsic-kernel-root-packet-${{ github.sha }}
          path: |
            intrinsic-kernel-root-packet-build.txt
            intrinsic-kernel-root-packet-axioms.txt
            intrinsic-kernel-root-packet-exact-square-axioms.txt
            intrinsic-root-packet-all-axioms.txt
          if-no-files-found: warn
