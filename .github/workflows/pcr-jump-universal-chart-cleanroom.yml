name: PCR Jump universal graph chart clean room

on:
  pull_request:
    branches:
      - pcr-jump-universal-chart-ci-base-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-universal-chart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  universal-chart-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/PolynomialGraphBlowupChartUniversalV2.lean \
              PCRLean/Experimental/PolynomialGraphBlowupChartUniversalV2Audit.lean; then
            echo 'Forbidden placeholder or custom axiom declaration found.' >&2
            exit 1
          fi
      - name: Build universal graph chart
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.PolynomialGraphBlowupChartUniversalV2 2>&1 \
            | tee universal-chart-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/PolynomialGraphBlowupChartUniversalV2Audit.lean 2>&1 \
            | tee universal-chart-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              universal-chart-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: git rev-parse HEAD | tee universal-chart-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-universal-chart-${{ github.sha }}
          path: |
            universal-chart-build.txt
            universal-chart-axioms.txt
            universal-chart-commit.txt
          if-no-files-found: warn
