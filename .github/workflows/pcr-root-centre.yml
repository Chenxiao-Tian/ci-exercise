name: PCR Root Centre verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-root-centre-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-centre-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get

      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/FrobeniusRootCentre.lean \
              PCRLean/SplitFrobeniusRootCentre.lean \
              PCRLean/CoordinateFrobeniusRootCentre.lean \
              PCRLean/RootCentreAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi

      - name: Build root-centre modules
        run: |
          set -o pipefail
          lake build PCRLean.FrobeniusRootCentre 2>&1 | tee root-centre-build.txt
          lake build PCRLean.SplitFrobeniusRootCentre 2>&1 | tee -a root-centre-build.txt
          lake build PCRLean.CoordinateFrobeniusRootCentre 2>&1 | tee -a root-centre-build.txt

      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/RootCentreAudit.lean 2>&1 | tee root-centre-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              root-centre-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi

      - name: Upload root-centre evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-root-centre-audit
          path: |
            root-centre-build.txt
            root-centre-axioms.txt
          if-no-files-found: warn
