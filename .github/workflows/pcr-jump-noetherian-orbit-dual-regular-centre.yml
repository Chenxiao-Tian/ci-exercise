name: PCR Jump Noetherian-orbit dual regular centre

on:
  push:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-noetherian-orbit-dual-regular-centre-${{ github.sha }}
  cancel-in-progress: false

jobs:
  noetherian-orbit-dual-regular-centre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/NoetherianOperatorOrbit.lean \
              PCRLean/FinitePacketEvaluation.lean \
              PCRLean/Experimental/IntrinsicKernelIdealFunctoriality.lean \
              PCRLean/Experimental/FiniteDimensionalSymmetricRegularBridge.lean \
              PCRLean/Experimental/FiniteDimensionalIntrinsicRegularCentre.lean \
              PCRLean/Experimental/SurjectiveFiniteDimensionalRegularCentre.lean \
              PCRLean/Experimental/DualPacketRegularCentre.lean \
              PCRLean/Experimental/NoetherianOrbitDualRegularCentre.lean \
              PCRLean/Experimental/NoetherianOrbitDualRegularCentreAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build Noetherian-orbit dual regular centre
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.NoetherianOrbitDualRegularCentre 2>&1 \
            | tee noetherian-orbit-dual-regular-centre-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/NoetherianOrbitDualRegularCentreAudit.lean 2>&1 \
            | tee noetherian-orbit-dual-regular-centre-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              noetherian-orbit-dual-regular-centre-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-noetherian-orbit-dual-regular-centre-${{ github.sha }}
          path: |
            noetherian-orbit-dual-regular-centre-build.txt
            noetherian-orbit-dual-regular-centre-axioms.txt
          if-no-files-found: warn
