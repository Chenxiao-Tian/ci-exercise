name: PCR Fractal X033 minimizer arrangement clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x033-maws-ted-base-20260804
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x033-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/IntrinsicOrderIdealLinearEquiv.lean
            PCRLean/Experimental/ProjectiveOrderIdealContent.lean
            PCRLean/Experimental/MarkedClosureArrangement.lean
            PCRLean/Experimental/CriticalPairTorExcess.lean
            PCRLean/Experimental/SchurFittingComplexity.lean
            PCRLean/Experimental/X033MinimizerArrangementIndex.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            echo 'Forbidden placeholder or project axiom detected.'
            exit 1
          fi

      - name: Install pinned Lean toolchain through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x033-evidence
          git rev-parse HEAD | tee x033-evidence/COMMIT.txt
          cat lean-toolchain | tee x033-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain \
            | tee x033-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x033-evidence/LEAN_VERSION.txt
          lake --version | tee x033-evidence/LAKE_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x033-evidence/LAKE_BUILD.log

      - name: Elaborate integrated X033 source
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X033MinimizerArrangementIndex.lean \
            2>&1 | tee x033-evidence/X033_ELABORATION.log

      - name: Run unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X033MinimizerArrangementIndexAudit.lean \
            2>&1 | tee x033-evidence/X033_AXIOM_AUDIT.log
          if grep -q 'sorryAx' x033-evidence/X033_AXIOM_AUDIT.log; then
            echo 'sorryAx detected in axiom output.'
            exit 1
          fi

      - name: Snapshot exact sources
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/IntrinsicOrderIdealLinearEquiv.lean x033-evidence/
          cp PCRLean/Experimental/ProjectiveOrderIdealContent.lean x033-evidence/
          cp PCRLean/Experimental/MarkedClosureArrangement.lean x033-evidence/
          cp PCRLean/Experimental/CriticalPairTorExcess.lean x033-evidence/
          cp PCRLean/Experimental/SchurFittingComplexity.lean x033-evidence/
          cp PCRLean/Experimental/X033MinimizerArrangementIndex.lean x033-evidence/
          cp PCRLean/Experimental/X033MinimizerArrangementIndexAudit.lean x033-evidence/
          cp PCRLean/ResearchRecords/MLEL_X033_MAWS_TED_REPORT.md x033-evidence/
          sha256sum x033-evidence/* | tee x033-evidence/X033_SOURCE_SHA256SUMS.txt

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X033-MAWS-TED-EVIDENCE
          path: x033-evidence
          if-no-files-found: error
          retention-days: 90
