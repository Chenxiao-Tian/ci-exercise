name: PCR Split Frobenius Chamber verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-split-frobenius-chamber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  split-frobenius-chamber-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/FrobeniusPowerIdeal.lean \
              PCRLean/CoordinateBlowupChart.lean \
              PCRLean/CoordinateCentrePrincipalization.lean \
              PCRLean/SplitFrobeniusChamber.lean \
              PCRLean/SplitFrobeniusChamberAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build split Frobenius chamber
        run: |
          set -o pipefail
          lake build PCRLean.SplitFrobeniusChamber 2>&1 | tee split-frobenius-chamber-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/SplitFrobeniusChamberAudit.lean 2>&1 | tee split-frobenius-chamber-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              split-frobenius-chamber-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-split-frobenius-chamber-audit
          path: |
            split-frobenius-chamber-build.txt
            split-frobenius-chamber-axioms.txt
          if-no-files-found: warn
