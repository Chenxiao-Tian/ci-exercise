name: PCR MLEL-002 verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-mlel002-${{ github.sha }}
  cancel-in-progress: false

jobs:
  mlel002-kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/MultiHasseOnlyDescent.lean \
              PCRLean/MultiOwnerHasseCore.lean \
              PCRLean/CoordinateCentreKernelBridge.lean \
              PCRLean/CoordinateBoundarySNC.lean \
              PCRLean/FreePassiveOwnerSafety.lean \
              PCRLean/CoordinateTerminalOverlap.lean \
              PCRLean/MultiOwnerSplitFrobeniusChamber.lean \
              PCRLean/MultiOwnerCoordinateFrobenius.lean \
              PCRLean/CoordinatePassiveSafety.lean \
              PCRLean/ResidualOwnerRank.lean \
              PCRLean/MLEL002Index.lean \
              PCRLean/MLEL002Audit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build MLEL-002 chain
        run: |
          set -o pipefail
          lake build PCRLean.MLEL002Index 2>&1 | tee mlel002-build.txt
      - name: Axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/MLEL002Audit.lean 2>&1 | tee mlel002-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              mlel002-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-mlel002-audit
          path: |
            mlel002-build.txt
            mlel002-axioms.txt
          if-no-files-found: warn
