name: PCR HMC-SCCD verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-hmc-sccd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hmc-sccd-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/HMCSCCD.lean \
              PCRLean/HMCSCCDAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build HMC-SCCD module
        run: |
          set -o pipefail
          lake build PCRLean.HMCSCCD 2>&1 | tee hmc-sccd-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/HMCSCCDAudit.lean 2>&1 | tee hmc-sccd-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              hmc-sccd-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-hmc-sccd-audit
          path: |
            hmc-sccd-build.txt
            hmc-sccd-axioms.txt
          if-no-files-found: warn
