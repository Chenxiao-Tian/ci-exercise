name: PCR Jump dual-packet resolution kernel

on:
  push:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-dual-packet-resolution-kernel-${{ github.sha }}
  cancel-in-progress: false

jobs:
  dual-packet-resolution-kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders in the corrected kernel
        run: |
          set -o pipefail
          files=(
            PCRLean/Experimental/IntrinsicKernelIdealFunctoriality.lean
            PCRLean/Experimental/IntrinsicKernelIdealMonotonicity.lean
            PCRLean/Experimental/IntrinsicKernelIdealExactSquare.lean
            PCRLean/Experimental/IntrinsicKernelRootPacket.lean
            PCRLean/Experimental/IntrinsicKernelRootPacketExactSquare.lean
            PCRLean/Experimental/FiniteDimensionalSymmetricRegularBridge.lean
            PCRLean/Experimental/DualPacketRegularCentre.lean
            PCRLean/Experimental/DualPacketRootPackage.lean
            PCRLean/Experimental/NoetherianOrbitDualRegularCentre.lean
            PCRLean/Experimental/MultiOwnerDualFrobeniusChamber.lean
            PCRLean/Experimental/NoetherianOrbitMultiOwnerDualChamber.lean
            PCRLean/Experimental/DualPacketExactTransport.lean
            PCRLean/Experimental/DualPacketBoundaryTransversality.lean
            PCRLean/Experimental/AbstractRootChartTerminality.lean
            PCRLean/Experimental/CoordinateRootChartInstance.lean
            PCRLean/Experimental/CausalBirthLedger.lean
            PCRLean/Experimental/DualPacketResolutionKernelIndex.lean
          )
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' "${files[@]}"; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build corrected dual-packet kernel
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.DualPacketResolutionKernelIndex 2>&1 \
            | tee dual-packet-resolution-kernel-build.txt
      - name: Integrated kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/DualPacketResolutionKernelIndex.lean 2>&1 \
            | tee dual-packet-resolution-kernel-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              dual-packet-resolution-kernel-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-dual-packet-resolution-kernel-${{ github.sha }}
          path: |
            dual-packet-resolution-kernel-build.txt
            dual-packet-resolution-kernel-axioms.txt
          if-no-files-found: warn
