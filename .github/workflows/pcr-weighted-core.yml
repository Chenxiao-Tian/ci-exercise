name: PCR Weighted Core verification

on:
  push:
    branches:
      - pcr-lean-formalization-20260801
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-weighted-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weighted-core-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get

      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/WeightedOperatorLedger.lean \
              PCRLean/FrobeniusRootCentre.lean \
              PCRLean/WeightedCoreAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi

      - name: Build weighted operator ledger
        run: |
          set -o pipefail
          lake build PCRLean.WeightedOperatorLedger 2>&1 | tee weighted-core-build.txt

      - name: Build Frobenius root-centre bridge
        run: |
          set -o pipefail
          lake build PCRLean.FrobeniusRootCentre 2>&1 | tee -a weighted-core-build.txt

      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/WeightedCoreAudit.lean 2>&1 | tee weighted-core-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              weighted-core-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi

      - name: Upload weighted-core evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-weighted-core-audit
          path: |
            weighted-core-build.txt
            weighted-core-axioms.txt
          if-no-files-found: warn
