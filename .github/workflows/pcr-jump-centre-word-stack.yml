name: PCR Jump centre-word stack

on:
  push:
    branches:
      - pcr-jump-lean-20260802-u2-root-boundary
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-centre-word-stack-${{ github.sha }}
  cancel-in-progress: false

jobs:
  centre-word-stack-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/NoetherianCentreWordStack.lean \
              PCRLean/Experimental/NoetherianCentreWordStackAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build centre-word stack candidate
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.NoetherianCentreWordStack 2>&1 \
            | tee centre-word-stack-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/NoetherianCentreWordStackAudit.lean 2>&1 \
            | tee centre-word-stack-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              centre-word-stack-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-centre-word-stack-${{ github.sha }}
          path: |
            centre-word-stack-build.txt
            centre-word-stack-axioms.txt
          if-no-files-found: warn
