name: PCR Fractal X032B projective-surjection split clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x032b-projective-split-base-20260803
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x032b-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/ProjectiveSurjectionSplitAtomic.lean
            PCRLean/Experimental/ProjectiveSurjectionSplitAtomicAudit.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            exit 1
          fi

      - name: Install pinned Lean
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x032b-evidence
          git rev-parse HEAD | tee x032b-evidence/COMMIT.txt
          cat lean-toolchain | tee x032b-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain | tee x032b-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x032b-evidence/LEAN_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x032b-evidence/LAKE_BUILD.log

      - name: Elaborate theorem and audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/ProjectiveSurjectionSplitAtomic.lean 2>&1 | tee x032b-evidence/ELABORATION.log
          lake env lean PCRLean/Experimental/ProjectiveSurjectionSplitAtomicAudit.lean 2>&1 | tee x032b-evidence/AXIOM_AUDIT.log
          if grep -q 'sorryAx' x032b-evidence/AXIOM_AUDIT.log; then exit 1; fi

      - name: Snapshot source
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/ProjectiveSurjectionSplitAtomic*.lean x032b-evidence/
          sha256sum x032b-evidence/*.lean | tee x032b-evidence/SOURCE_SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X032B-PROJECTIVE-SPLIT-EVIDENCE
          path: x032b-evidence
          if-no-files-found: error
          retention-days: 90
