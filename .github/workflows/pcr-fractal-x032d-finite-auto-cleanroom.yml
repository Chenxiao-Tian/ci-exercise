name: PCR Fractal X032D finite-projective automatic frame clean room

on:
  pull_request:
    branches:
      - pcr-fractal-x032d-finite-auto-base-20260803
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x032d-cleanroom:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact PR merge
        uses: actions/checkout@v4

      - name: Reject placeholders and project axioms
        shell: bash
        run: |
          set -euo pipefail
          files=(
            PCRLean/Experimental/FiniteProjectiveAutomaticDualFrame.lean
            PCRLean/Experimental/FiniteProjectiveCokernelOrderIdealCompiler.lean
            PCRLean/Experimental/X032FiniteProjectiveAutomaticIndex.lean
          )
          if grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*axiom[[:space:]]' "${files[@]}"; then
            echo 'Forbidden placeholder or project axiom detected.'
            exit 1
          fi

      - name: Install pinned Lean toolchain through elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Record exact environment
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          mkdir -p x032d-evidence
          git rev-parse HEAD | tee x032d-evidence/COMMIT.txt
          cat lean-toolchain | tee x032d-evidence/LEAN_TOOLCHAIN.txt
          sha256sum lakefile.toml lake-manifest.json lean-toolchain \
            | tee x032d-evidence/ENVIRONMENT_SHA256SUMS.txt
          lean --version | tee x032d-evidence/LEAN_VERSION.txt
          lake --version | tee x032d-evidence/LAKE_VERSION.txt

      - name: Build official default target
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake build 2>&1 | tee x032d-evidence/LAKE_BUILD.log

      - name: Elaborate integrated X032D source
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X032FiniteProjectiveAutomaticIndex.lean \
            2>&1 | tee x032d-evidence/X032D_ELABORATION.log

      - name: Run unified axiom audit
        shell: bash
        run: |
          set -euo pipefail
          source "$HOME/.elan/env"
          lake env lean PCRLean/Experimental/X032FiniteProjectiveAutomaticIndexAudit.lean \
            2>&1 | tee x032d-evidence/X032D_AXIOM_AUDIT.log
          if grep -q 'sorryAx' x032d-evidence/X032D_AXIOM_AUDIT.log; then
            echo 'sorryAx detected in axiom output.'
            exit 1
          fi

      - name: Snapshot exact sources
        shell: bash
        run: |
          set -euo pipefail
          cp PCRLean/Experimental/FiniteProjectiveAutomaticDualFrame.lean x032d-evidence/
          cp PCRLean/Experimental/FiniteProjectiveCokernelOrderIdealCompiler.lean x032d-evidence/
          cp PCRLean/Experimental/X032FiniteProjectiveAutomaticIndex.lean x032d-evidence/
          cp PCRLean/Experimental/X032FiniteProjectiveAutomaticIndexAudit.lean x032d-evidence/
          cp PCRLean/ResearchRecords/MLEL_X032D_FPA_IOM_REPORT.md x032d-evidence/
          sha256sum x032d-evidence/* | tee x032d-evidence/X032D_SOURCE_SHA256SUMS.txt

      - name: Upload exact evidence
        uses: actions/upload-artifact@v4
        with:
          name: PCR-FRACTAL-X032D-FPA-IOM-EVIDENCE
          path: x032d-evidence
          if-no-files-found: error
          retention-days: 90
