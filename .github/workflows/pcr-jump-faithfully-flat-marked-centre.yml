name: PCR Jump faithfully flat marked-centre descent

on:
  push:
    branches:
      - pcr-jump-integral-heredity-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-ff-marked-centre-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ff-marked-centre-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/FaithfullyFlatMarkedCentreDescent.lean \
              PCRLean/Experimental/FaithfullyFlatMarkedCentreDescentAudit.lean \
              PCRLean/Experimental/GradedFrobeniusHeredityKernelIndex.lean \
              PCRLean/Experimental/GradedFrobeniusHeredityKernelIndexAudit.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build integrated heredity index
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.GradedFrobeniusHeredityKernelIndex 2>&1 \
            | tee ff-marked-centre-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/GradedFrobeniusHeredityKernelIndexAudit.lean 2>&1 \
            | tee ff-marked-centre-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              ff-marked-centre-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: git rev-parse HEAD | tee ff-marked-centre-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-ff-marked-centre-${{ github.sha }}
          path: |
            ff-marked-centre-build.txt
            ff-marked-centre-axioms.txt
            ff-marked-centre-commit.txt
          if-no-files-found: warn
