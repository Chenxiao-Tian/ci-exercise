name: PCR Jump graph debt clean room

on:
  pull_request:
    branches:
      - pcr-jump-graph-debt-ci-base-20260803
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcr-jump-graph-debt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  graph-debt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf \
            | sh -s -- -y --default-toolchain leanprover/lean4:v4.30.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned mathlib
        run: |
          set -o pipefail
          lake update
          lake exe cache get
      - name: Reject placeholders in the exact proof slice
        run: |
          set -o pipefail
          if grep -nE '^[[:space:]]*(axiom|sorry|admit)([[:space:]]|$)' \
              PCRLean/Experimental/GradedFrobeniusHeredityKernelIndex.lean \
              PCRLean/Experimental/GradedFrobeniusHeredityKernelIndexAudit.lean \
              PCRLean/Experimental/FrobeniusNormalCentre.lean \
              PCRLean/Experimental/GradedPowerReflection.lean \
              PCRLean/Experimental/NormalConeLayer.lean \
              PCRLean/Experimental/CoordinateNormalConeFrobeniusReduced.lean \
              PCRLean/Experimental/FrobeniusNormalFaithfullyFlatDescent.lean \
              PCRLean/Experimental/FrobeniusNormalLocalCoordinateModel.lean \
              PCRLean/Experimental/CeilingMarkedPowerReflection.lean \
              PCRLean/Experimental/ControlledFrobeniusTransform.lean \
              PCRLean/Experimental/CeilingControlledTransformDebt.lean \
              PCRLean/Experimental/CoordinateControlledTransformHeredity.lean \
              PCRLean/Experimental/PolynomialGraphCentreHeredity.lean \
              PCRLean/Experimental/PolynomialGraphCentreQuotient.lean \
              PCRLean/Experimental/PolynomialGraphBlowupHeredity.lean \
              PCRLean/Experimental/PolynomialGraphMarkedTransformDebt.lean \
              PCRLean/Experimental/PolynomialGraphFrobeniusCentreCertificate.lean \
              PCRLean/Experimental/PolynomialGraphArbitraryMarkCertificate.lean; then
            echo 'Forbidden proof placeholder or custom axiom found.' >&2
            exit 1
          fi
      - name: Build integrated graph-debt index
        run: |
          set -o pipefail
          lake build PCRLean.Experimental.GradedFrobeniusHeredityKernelIndex 2>&1 \
            | tee graph-debt-build.txt
      - name: Kernel axiom audit
        run: |
          set -o pipefail
          lake env lean PCRLean/Experimental/GradedFrobeniusHeredityKernelIndexAudit.lean 2>&1 \
            | tee graph-debt-axioms.txt
          if grep -E 'sorryAx|PCRLean\..*Axiom|ResolutionAxiom|PacketizationAxiom' \
              graph-debt-axioms.txt; then
            echo 'Unpermitted axiom detected.' >&2
            exit 1
          fi
      - name: Record exact commit
        run: |
          git rev-parse HEAD | tee graph-debt-commit.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcr-jump-graph-debt-${{ github.sha }}
          path: |
            graph-debt-build.txt
            graph-debt-axioms.txt
            graph-debt-commit.txt
          if-no-files-found: warn
